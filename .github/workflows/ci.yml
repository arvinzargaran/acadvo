name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (migrations + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acadvo
          POSTGRES_PASSWORD: acadvo
          POSTGRES_DB: acadvo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acadvo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET_KEY: ci-dummy-jwt-secret-key-at-least-32-characters-long
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL_SYNC: postgresql://acadvo:acadvo@localhost:5432/acadvo
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test --if-present
