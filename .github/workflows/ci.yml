name: CI

on:
  push:
  pull_request:

# Least privilege by default. The workflow only reads the repo; individual jobs
# widen this where they genuinely need to (CodeQL uploads results).
# Without this, GITHUB_TOKEN gets whatever the repository default is — often
# write — so a compromised dependency in any build step could push to the repo.
permissions:
  contents: read

# Note on action pinning: every `uses:` below is pinned to a commit SHA rather
# than a tag. Tags are mutable, so `@v4` is an instruction to run whatever code
# that tag points at on the day the job runs — the exact supply-chain weakness
# behind the tj-actions/changed-files compromise. The trailing comment records
# the human-readable version for review.

jobs:
  backend:
    name: Backend (migrations + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acadvo
          POSTGRES_PASSWORD: acadvo
          POSTGRES_DB: acadvo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acadvo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET_KEY: ci-dummy-jwt-secret-key-at-least-32-characters-long
      DEBUG: "True"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL_SYNC: postgresql://acadvo:acadvo@localhost:5432/acadvo
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Correctness and accessibility only — no style rules. Added after an audit
      # found every form field in the app unlabelled and the university combobox
      # unreachable by keyboard; both are exactly what jsx-a11y catches, and both
      # were invisible to the test suite and to review.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      # `npm test --if-present` passed --if-present through to vitest as an
      # unknown argument instead of guarding the script, so a missing or failing
      # test script could slip through. `npm run test` is the correct form.
      - name: Test
        working-directory: frontend
        run: npm run test

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Audits the pinned requirements file against the PyPI advisory database.
      # This is the check that would have caught python-jose's algorithm-confusion
      # and JWT-bomb advisories, and the Starlette multipart DoS.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt --strict --progress-spinner off

      # Not a bare `npm audit`: the gate script fails on any high/critical
      # advisory EXCEPT ones explicitly accepted, with a written justification
      # and an expiry date, in frontend/audit-allowlist.json. That keeps the
      # check enforcing rather than permanently red on an advisory whose only
      # published "fix" is a downgrade into a worse position.
      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm ci
          npm run audit

  static-analysis:
    name: Static analysis (CodeQL + Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeQL needs this to upload findings to the Security tab.
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Bandit catches the Python-specific patterns CodeQL is weaker on:
      # hardcoded secrets, weak hashes, shell=True, assert-based auth checks.
      # `-ll` reports medium severity and above so low-confidence noise does not
      # block merges.
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r backend/app -ll

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          languages: python,javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks needs history to scan commits, not just the working tree —
          # a secret that was committed and later removed is still exposed.
          fetch-depth: 0

      # Free for individual accounts and public repos. If this repo lives under a
      # GitHub *organisation*, gitleaks-action additionally requires a
      # GITLEAKS_LICENSE secret and this step will fail without one — swap in the
      # gitleaks binary directly (`docker run zricethezav/gitleaks detect`) if you
      # do not want a licence.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Production images build
    runs-on: ubuntu-latest

    # The Dockerfiles are not exercised by any job above: the backend job runs
    # pytest on the runner and the frontend job runs `npm run build` on the
    # runner, so a broken image (a non-root permission problem, a bad sed in the
    # CSP rewrite, a missing COPY) is only discovered on the deployment host.
    # That has already happened once. Building both images here — and checking
    # the compose file interpolates — moves that failure into CI.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build backend image
        run: docker build -t acadvo-backend:ci ./backend

      - name: Build frontend image
        # A real https URL, not a placeholder: the frontend Dockerfile derives
        # the CSP connect-src from it with sed, so a value of the wrong shape
        # would bake a broken policy and still build green.
        run: docker build -t acadvo-frontend:ci --build-arg VITE_API_URL=https://api.example.com ./frontend

      - name: Frontend image serves the app and its security headers
        run: |
          docker run -d --name fe -p 8080:8080 acadvo-frontend:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          headers=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/)
          echo "$headers"
          # The CSP placeholder must have been substituted, and the API origin
          # must be in connect-src or every XHR from the deployed app is blocked.
          echo "$headers" | grep -qi 'content-security-policy' || { echo "no CSP"; exit 1; }
          # `if` rather than `grep ... && { exit 1; }`: the && form returns grep's
          # exit status, so the *passing* case (no match) fails the step under
          # the shell's -e.
          if echo "$headers" | grep -q '__CSP_CONNECT_SRC__'; then
            echo "CSP placeholder was not substituted"; exit 1
          fi
          echo "$headers" | grep -q 'https://api.example.com' || { echo "API origin missing from CSP"; exit 1; }
          echo "$headers" | grep -qi 'x-frame-options: DENY' || { echo "no X-Frame-Options"; exit 1; }
          docker rm -f fe

      - name: Production compose file is valid
        env:
          APP_DOMAIN: example.com
          API_DOMAIN: api.example.com
          ACME_EMAIL: ci@example.com
          POSTGRES_USER: acadvo
          POSTGRES_PASSWORD: ci-only-not-a-real-password
          POSTGRES_DB: acadvo
          VITE_API_URL: https://api.example.com
        run: docker compose -f docker-compose.prod.yml config >/dev/null
