# Included into every location block in nginx.conf. See the comment at the top
# of that file for why this cannot just live at server level.
#
# `always` makes the header apply to error responses (4xx/5xx) too, not only 2xx.
#
# __CSP_CONNECT_SRC__ is replaced at image build time with the API origin taken
# from the VITE_API_URL build arg (see frontend/Dockerfile). It has to be listed
# explicitly: the API is a separate origin, and under `connect-src 'self'` alone
# every XHR from the app would be blocked.
#
# 'unsafe-inline' in style-src is required — Tailwind and Framer Motion inject
# inline styles. There is deliberately no 'unsafe-inline'/'unsafe-eval' in
# script-src, which is what actually stops injected markup from executing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' __CSP_CONNECT_SRC__; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# HSTS. Only meaningful once TLS terminates in front of this container (see the
# `proxy` service in docker-compose.prod.yml). Harmless over plain HTTP —
# browsers ignore the header on non-HTTPS responses — so it is safe to always
# send. `preload` is intentionally omitted: it is very hard to undo, so opt in
# by hand at hstspreload.org once the domain is known-good on HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;

# frame-ancestors 'none' in the CSP above is the modern control; X-Frame-Options
# is kept for browsers that only honour the older header.
add_header X-Frame-Options "DENY" always;

# Stricter than the previous no-referrer-when-downgrade: never leak the path of
# an authenticated page (which can contain IDs) to a third-party origin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The app uses none of these; deny them so injected content cannot either.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# Keep the app out of cross-origin popups/embeds it never intends to talk to.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
