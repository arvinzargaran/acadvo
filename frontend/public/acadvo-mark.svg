<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="acadvo">
  <!-- Grid: stroke 44, node dia 88 (2x stroke), hole dia 44 (1x stroke).
       Holes are punched, not filled white, so the mark works on any ground. -->
  <mask id="acadvo-holes">
    <rect width="512" height="512" fill="#fff"/>
    <circle cx="227" cy="296" r="22" fill="#000"/>
    <circle cx="373" cy="296" r="22" fill="#000"/>
    <circle cx="139" cy="416" r="22" fill="#000"/>
    <circle cx="373" cy="416" r="22" fill="#000"/>
  </mask>
  <g mask="url(#acadvo-holes)" fill="#1B62F0">
    <g stroke="#1B62F0" stroke-width="44" stroke-linecap="round" fill="none">
      <path d="M139 416 L373 96"/>
      <path d="M373 96 L373 416"/>
      <path d="M227 296 L373 296"/>
    </g>
    <circle cx="373" cy="96"  r="44"/>
    <circle cx="227" cy="296" r="44"/>
    <circle cx="373" cy="296" r="44"/>
    <circle cx="139" cy="416" r="44"/>
    <circle cx="373" cy="416" r="44"/>
  </g>
</svg>
