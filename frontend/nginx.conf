server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references hashed JS/CSS bundles, so it must never be cached or
    # clients keep loading an old app (with dead bundle URLs) after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA service worker & registration bootstrap must never be cached long-term,
    # or clients get stuck on a stale worker and never receive updates. Exact-match
    # locations take priority over the immutable static-asset rule below.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
