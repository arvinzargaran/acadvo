# Security headers are defined once here and pulled into every location with
# `include`. This is deliberate: nginx's `add_header` is NOT inherited into a
# location block that declares an `add_header` of its own, so the server-level
# headers below would silently vanish from every block that sets Cache-Control —
# including `location = /index.html`, which is what actually serves the SPA
# document (the `try_files ... /index.html` fallback internally re-matches it).
# That would leave the app's only real page with no X-Frame-Options at all.

server {
    # 8080, not 80: binding a port below 1024 needs root, and this container
    # runs as the unprivileged `nginx` user (see Dockerfile).
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version in responses and error pages.
    server_tokens off;

    # Scratch paths under /tmp, not /var/cache/nginx.
    #
    # This container runs read-only with a tmpfs for scratch. A tmpfs mounts
    # root-owned by default, which overlays whatever ownership the image set at
    # build time — so an unprivileged nginx cannot mkdir inside /var/cache/nginx
    # and dies at startup with "mkdir() ... failed (13: Permission denied)".
    # /tmp is mode 1777, so it works no matter how the tmpfs is mounted, and
    # keeps the compose file from having to hardcode this image's uid.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # This server block serves static assets only — no upload endpoint lives
    # here — so keep bodies small. Uploads go directly to the API origin.
    client_max_body_size 1m;

    # SPA fallback — all routes serve index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # index.html references hashed JS/CSS bundles, so it must never be cached or
    # clients keep loading an old app (with dead bundle URLs) after a deploy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # PWA service worker & registration bootstrap must never be cached long-term,
    # or clients get stuck on a stale worker and never receive updates. Exact-match
    # locations take priority over the immutable static-asset rule below.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /registerSW.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Don't serve dotfiles (.git, .env) if one ever lands in the web root.
    location ~ /\. {
        deny all;
    }
}
